[package]
name = "convolution_plug"
version = "0.1.0"
edition = "2021"
authors = ["dvub <todo@todo.com>"]
license = "Other licenses can be set in Cargo.toml, but using the project needs to be GPLv3 compliant to be able to use the VST3 exporter. Check Cargo.toml for more information."
homepage = "todo"
description = "todo"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = [
    "assert_process_allocs",
] }

# DSP 
fundsp = { git = "https://github.com/dvub/fundsp.git" }
convolution = { git = "https://github.com/holoplot/fft-convolution.git" }
# other IR processing
hound = "3.5.1"
rubato = "0.16.2"

# GUI
nih_plug_webview = { git = "https://github.com/dvub/nih-plug-webview", branch = "no-reparent" }
mime_guess = { version = "2.0.5", optional = true }
include_dir = { version = "0.7.4", optional = true }
serde = "1.0.219"
serde_json = "1.0.140"
ts-rs = "11.0.1"
# error handling
anyhow = "1.0.98"
directories = "6.0.0"
crossbeam-channel = "0.5.15"
rayon = "1.11.0"


# Uncomment the below line to disable the on-by-default VST3 feature to remove
# the GPL compatibility requirement
# nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["assert_process_allocs"] }

[features]
embedded-gui = ["dep:mime_guess", "dep:include_dir"]


[dev-dependencies]
tempdir = "0.3.7"
float-cmp = "0.10.0"

# criterion = { version = "0.5", features = ["html_reports"] }

# [[bench]]
# name = "benchmark"
# harness = false

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
